name: spark-serving-lab
services:
  encoder:
    image: local/spark-serving:book-fixture
    pull_policy: never
    ports:
      - "127.0.0.1:8088:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    stop_grace_period: 30s
    restart: "no"
